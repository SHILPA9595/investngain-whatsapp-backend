
name: Invest N Gain Followup Scheduler

on:
  schedule:
    - cron: '*/15 * * * *'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investngain-followup-registration
  cancel-in-progress: false

jobs:
  register-followups:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Register due followup jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is missing"
            exit 1
          fi

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 120 \
            --request POST \
            --header "x-cron-secret: $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            https://investngain-whatsapp-backend.onrender.com/cron/register-followups
