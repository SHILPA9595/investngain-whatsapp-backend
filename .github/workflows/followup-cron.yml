name: Invest N Gain Followup Scheduler

on:
  schedule:
    - cron: '*/15 * * * *'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investngain-followup-processor
  cancel-in-progress: false

jobs:
  process-followups:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Process due followup jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is missing"
            exit 1
          fi

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --max-time 120 \
            --output response.txt \
            --write-out "%{http_code}" \
            --request POST \
            --header "x-cron-secret: $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            https://investngain-whatsapp-backend.onrender.com/cron/run-followups)

          cat response.txt
          echo ""

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Follow-up processor completed."
          elif [ "$HTTP_STATUS" = "423" ]; then
            echo "Automatic sending is OFF. No messages were sent."
          else
            echo "Follow-up processor failed with HTTP $HTTP_STATUS"
            exit 1
          fi
